name: Build package
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: v6.22.3
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build package
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW32
          install: >-
            base-devel
            mingw-w64-i686-toolchain
            mingw-w64-i686-python
            mingw-w64-i686-python-pip

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: pyinstaller/pyinstaller
          ref: ${{ inputs.ref }}

      - name: Build bootloader
        run: |
          cd bootloader
          CFLAGS=-DPSAPI_VERSION=1 \
          LDFLAGS=-lpsapi \
          python waf all --target-arch=32bit --gcc

      - name: Build package
        run: |
          python -m pip install --upgrade pip hatchling
          PYI_PLATFORM=Windows-32bit-intel \
          PYI_WHEEL_TAG=win32 \
          python -m hatchling build -t wheel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pyinstaller-6.22.3-packages
          path: dist/*
